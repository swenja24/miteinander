name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: miteinander_ci
          POSTGRES_USER: miteinander
          POSTGRES_PASSWORD: miteinander-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miteinander -d miteinander_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit==2.10.1 bandit==1.9.4

      - name: Audit dependencies and Python security
        run: |
          pip-audit -r requirements.txt
          bandit -r config core manage.py -x core/tests -lll -ii

      - name: Run Django checks and tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-characters-123456
          DATABASE_URL: postgresql://miteinander:miteinander-ci-password@127.0.0.1:5432/miteinander_ci
          SECURE_SSL_REDIRECT: "false"
          COOKIE_SECURE: "false"
        run: |
          pip check
          python -m compileall -q config core
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py collectstatic --noinput
          python manage.py test core.tests -v 2
          node --check public/app.js
          node --check public/service-worker.js
          sh -n docker/entrypoint.sh scripts/backup.sh scripts/restore-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Miteinander
            org.opencontainers.image.description=Eingliederungshilfe gemeinsam und übersichtlich organisieren
            org.opencontainers.image.licenses=MIT

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create build attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
